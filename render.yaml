services:
  - type: web
    name: signalcivic
    runtime: node
    plan: free
    buildCommand: "cd client && npm install && npm run build && cd ../server && npm install"
    startCommand: "node server/src/index.js"
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 22

  - type: web
    name: extract-mutuelle
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python web_app.py"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
